name: Aster-56 descriptor-custody donor materializer

on:
  push:
    branches:
      - aster-56/effect-ledger-fd-aba-closure
    paths:
      - .github/aster56_materialize.py.b64.*
      - .github/workflows/aster56-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reassemble hash-guarded materializer
        run: |
          cat \
            .github/aster56_materialize.py.b64.00 \
            .github/aster56_materialize.py.b64.01 \
            .github/aster56_materialize.py.b64.02 \
            .github/aster56_materialize.py.b64.03 \
            | base64 --decode > .github/aster56_materialize.py
          test "$(sha256sum .github/aster56_materialize.py | cut -d' ' -f1)" = "350ba73031ed2419d33ab7a1272a1e819e9b3fe8614fcc17827772e9a24a79ab"
      - name: Materialize exact donor payloads
        run: python .github/aster56_materialize.py
      - name: Compile exact donor files
        run: >-
          python -m py_compile
          effect_receipt_ledger.py
          effect_receipts.py
          tests/test_effect_receipts.py
          tests/test_effect_ledger_path_custody.py
      - name: Focused normal
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: >-
          python -m unittest -v
          tests.test_effect_receipts
          tests.test_effect_ledger_path_custody
      - name: Focused optimized
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: >-
          python -O -m unittest -v
          tests.test_effect_receipts
          tests.test_effect_ledger_path_custody
      - name: Commit exact donor and remove transport
        env:
          TARGET_BRANCH: aster-56/effect-ledger-fd-aba-closure
        run: |
          git config user.name "Aster-56"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add effect_receipt_ledger.py tests/test_effect_ledger_path_custody.py
          git rm \
            .github/aster56_materialize.py.b64.00 \
            .github/aster56_materialize.py.b64.01 \
            .github/aster56_materialize.py.b64.02 \
            .github/aster56_materialize.py.b64.03 \
            .github/workflows/aster56-materialize.yml
          rm .github/aster56_materialize.py
          git diff --cached --check
          git commit -m "Bind SQLite opens to retained descriptor (#14)"
          git push origin "HEAD:${TARGET_BRANCH}"
