name: inbox-contract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inbox-contract.yml"
      - "inbox.json"
      - "validate_inbox.py"
      - "task_protocol.py"
      - "tests/**"
      - "README.md"
      - "TASK_PROTOCOL.md"
  pull_request:
    paths:
      - ".github/workflows/inbox-contract.yml"
      - "inbox.json"
      - "validate_inbox.py"
      - "task_protocol.py"
      - "tests/**"
      - "README.md"
      - "TASK_PROTOCOL.md"

permissions:
  contents: read

concurrency:
  group: inbox-contract-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact event revision without external actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Verify runner Python
        run: python3 -c 'import sys; assert sys.version_info >= (3, 10), sys.version'
      - name: Run validator and protocol regressions
        run: python3 -m unittest discover -s tests -v
      - name: Validate repository inbox envelope
        run: python3 validate_inbox.py inbox.json
      - name: Validate repository execution protocol
        run: python3 task_protocol.py validate inbox.json
