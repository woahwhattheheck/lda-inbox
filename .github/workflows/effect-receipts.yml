name: effect-receipts

on:
  push:
    branches: [main]
    paths:
      - "effect_receipts.py"
      - "effect_receipt_common.py"
      - "effect_receipt_ledger.py"
      - "effect_receipt_io.py"
      - "EFFECT_RECEIPTS.md"
      - "tests/test_effect_receipts.py"
      - ".github/workflows/effect-receipts.yml"
  pull_request:
    paths:
      - "effect_receipts.py"
      - "effect_receipt_common.py"
      - "effect_receipt_ledger.py"
      - "effect_receipt_io.py"
      - "EFFECT_RECEIPTS.md"
      - "tests/test_effect_receipts.py"
      - ".github/workflows/effect-receipts.yml"

permissions:
  contents: read

concurrency:
  group: effect-receipts-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax
        run: python -m py_compile effect_receipts.py effect_receipt_common.py effect_receipt_ledger.py effect_receipt_io.py tests/test_effect_receipts.py
      - name: Focused normal
        run: python -m unittest -v tests.test_effect_receipts
      - name: Focused optimized
        run: python -O -m unittest -v tests.test_effect_receipts
