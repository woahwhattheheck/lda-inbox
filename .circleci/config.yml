version: 2.1

jobs:
  inbox-contract:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    parallelism: 1
    steps:
      - checkout
      - run:
          name: Runtime receipt
          command: python --version
      - run:
          name: Run validator and protocol regressions
          command: python -m unittest discover -s tests -v
          no_output_timeout: 5m
      - run:
          name: Validate repository inbox envelope
          command: python validate_inbox.py inbox.json
          no_output_timeout: 2m
      - run:
          name: Validate repository execution protocol
          command: python task_protocol.py validate inbox.json
          no_output_timeout: 2m

workflows:
  public-ci-redundancy-pilot:
    jobs:
      - inbox-contract:
          filters:
            branches:
              only:
                - main
                - zms-k7q9/circleci-public-pilot
